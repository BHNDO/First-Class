<meta charset="utf-8">
<title>Project DevCity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=VT323&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/office.css">
<link rel="stylesheet" href="css/city.css">
<link rel="stylesheet" href="css/capital.css">
<link rel="stylesheet" href="css/market.css">
<link rel="stylesheet" href="css/ventures.css">
<link rel="stylesheet" href="css/fx.css">
<header id="hud">
  <div class="brand"><b data-live="studio"></b><small>Project DevCity</small></div>
  <dl class="stats">
    <div><dt>Caixa</dt><dd id="money" data-live="money"></dd></div>
    <div><dt>Data</dt><dd data-live="date"></dd></div>
    <div><dt>Reputação</dt><dd data-live="rep"></dd></div>
    <div><dt>Fãs</dt><dd data-live="fans"></dd></div>
    <div><dt>Pesquisa</dt><dd><span data-live="rp"></span> PP</dd></div>
  </dl>
  <div id="time" role="group" aria-label="Velocidade do tempo">
    <button data-speed="0" aria-label="Pausar" title="Pausar (espaço)">II</button>
    <button data-speed="1" aria-label="Velocidade normal" title="Velocidade normal (1)">1x</button>
    <button data-speed="2" aria-label="Velocidade 2x" title="Velocidade 2x (2)">2x</button>
    <button data-speed="3" aria-label="Velocidade 3x" title="Velocidade 3x (3)">3x</button>
  </div>
  <button id="reset">Novo jogo</button>
</header>
<main id="stage">
  <canvas id="world" role="img" aria-label="Escritório do estúdio em vista isométrica"></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <div id="pauseTag">Pausado</div>
  <div id="viewSwitch" role="group" aria-label="Visão"><button data-view="office" aria-pressed="true">Escritório</button><button data-view="city" aria-pressed="false">Cidade</button></div>
  <div id="crunchTag" hidden>Crunch ativo</div>
  <div id="where" data-live="office"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
</main>
<section id="panel" aria-label="Painel de gestão">
  <div class="tabbar">
    <div role="tablist" id="tabs" aria-label="Departamentos"></div>
    <button id="collapse" aria-expanded="true" aria-controls="tp">Recolher</button>
  </div>
  <div role="tabpanel" id="tp" tabindex="0"></div>
</section>
<dialog id="modal" aria-labelledby="mt"><form method="dialog"><h2 id="mt"></h2><div id="mb"></div><div id="mf"></div></form></dialog>

<script src="js/core.js"></script>
<script src="js/office.js"></script>
<script src="js/hardware.js"></script>
<script src="js/city.js"></script>
<script src="js/capital.js"></script>
<script src="js/market.js"></script>
<script src="js/ventures.js"></script>
<script src="js/fx.js"></script>
<script src="js/main.js"></script>
